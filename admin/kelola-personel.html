    <!-- FIREBASE AUTH & GATEKEEPER -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signOut, 
            setPersistence, 
            browserLocalPersistence 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAej1I-XTtLTrOBC-qx_omRByTkmQroBZE",
            authDomain: "login-page-dashboard.firebaseapp.com",
            projectId: "login-page-dashboard",
            storageBucket: "login-page-dashboard.firebasestorage.app",
            messagingSenderId: "817524864615",
            appId: "1:817524864615:web:fc27233cbf881e726e06c2",
            measurementId: "G-CLG98RXRNT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        setPersistence(auth, browserLocalPersistence);

        const TIMEOUT_LIMIT = 15 * 60 * 1000;

        function updateLastActiveTimestamp() {
            localStorage.setItem("lastActiveTime", Date.now().toString());
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "../login.html";
            } else {
                const lastActive = localStorage.getItem("lastActiveTime");
                const now = Date.now();
                if (lastActive && (now - parseInt(lastActive, 10) > TIMEOUT_LIMIT)) {
                    localStorage.removeItem("lastActiveTime");
                    await signOut(auth);
                    window.location.href = "../login.html";
                    return;
                }
                updateLastActiveTimestamp();
            }
        });

        window.handleLogout = function() {
            Swal.fire({
                title: 'Konfirmasi Logout',
                text: 'Apakah Anda yakin ingin keluar dari sistem?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, Logout',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem("lastActiveTime");
                    signOut(auth).then(() => {
                        window.location.href = "../login.html";
                    });
                }
            });
        };
    </script>

    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT WEB APP KAMU DI SINI
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbycTmSZR5MyhRkhrP-T_JqRlOuL56DkquxPJPmMLTXCuZjbwcgLdRJpsFJTX6ZeKEEr1A/exec";

        let combinedData = [];

        function cleanNipp(val) {
            if (!val) return "";
            return String(val).replace(/\D/g, "");
        }

        // Format tanggal dari DD/MM/YYYY atau ISO ke YYYY-MM-DD (untuk input type="date")
        function parseToInputDate(val) {
            if (!val) return "";
            let strVal = String(val).trim();

            if (strVal.includes("T") && strVal.includes("Z")) {
                let d = new Date(strVal);
                if (!isNaN(d.getTime())) {
                    return d.toISOString().split('T')[0];
                }
            }

            if (strVal.includes("/")) {
                let parts = strVal.split("/");
                if (parts.length === 3) {
                    let day = parts[0].padStart(2, '0');
                    let month = parts[1].padStart(2, '0');
                    let year = parts[2];
                    return `${year}-${month}-${day}`;
                }
            }
            return strVal;
        }

        // Format tampilan tanggal di tabel (DD/MM/YYYY)
        function formatDateValue(val) {
            if (!val) return "-";
            let strVal = String(val).trim();
            if (strVal.includes("T") && strVal.includes("Z")) {
                let d = new Date(strVal);
                if (!isNaN(d.getTime())) {
                    let day = String(d.getDate()).padStart(2, '0');
                    let month = String(d.getMonth() + 1).padStart(2, '0');
                    let year = d.getFullYear();
                    return `${day}/${month}/${year}`;
                }
            }
            return strVal;
        }

        // Pemetaan Urutan Hierarki Jabatan
        const JABATAN_RANK = {
            "KUPT CREW KA": 1,
            "PENYELIA INSTRUKTUR": 2,
            "PENYELIA DINAS": 3,
            "MASINIS MADYA": 4,
            "MASINIS MUDA": 5,
            "MASINIS PERTAMA": 6
        };

        async function fetchSpreadsheetData() {
            try {
                const response = await fetch(APPS_SCRIPT_URL, { method: "GET", redirect: "follow" });
                const result = await response.json();

                if (result.result === "success" || result.status === "success") {
                    const dataMulai = result.data["Data Mulai Bekerja"] || [];
                    const dataJabatan = result.data["Jabatan"] || [];

                    const processedNipps = new Set();
                    combinedData = [];

                    // 1. DAHULUKAN SHEET "Data Mulai Bekerja"
                    dataMulai.forEach(m => {
                        const nippClean = cleanNipp(m["NIPP"] || m["NIP"]);
                        if (nippClean) processedNipps.add(nippClean);

                        const matchJabatan = dataJabatan.find(j => cleanNipp(j["NIPP"] || j["NIP"]) === nippClean);

                        combinedData.push({
                            rowIndexMulai: m._rowIndex,
                            rowIndexJabatan: matchJabatan ? matchJabatan._rowIndex : null,
                            nama: m["NAMA"] || (matchJabatan ? matchJabatan["NAMA"] : ""),
                            nipp: m["NIPP"] || m["NIP"] || (matchJabatan ? matchJabatan["NIPP"] : ""),
                            jabatan: matchJabatan ? (matchJabatan["Jabatan"] || matchJabatan["JABATAN"] || "") : (m["JABATAN"] || ""),
                            binaan: matchJabatan ? (matchJabatan["Binaan"] || matchJabatan["BINAAN"] || "-") : "-",
                            mulaiBekerja: formatDateValue(m["MULAI BEKERJA"] || m["TANGGAL MASUK"] || "")
                        });
                    });

                    // 2. MASUKKAN PERSONEL DARI SHEET "Jabatan" YANG BELUM TERCATAT DI "Data Mulai Bekerja" (KUPT, Instruktur, Penyelia)
                    dataJabatan.forEach(j => {
                        const nippClean = cleanNipp(j["NIPP"] || j["NIP"]);
                        if (nippClean && !processedNipps.has(nippClean)) {
                            processedNipps.add(nippClean);
                            combinedData.push({
                                rowIndexMulai: null,
                                rowIndexJabatan: j._rowIndex,
                                nama: j["NAMA"] || "",
                                nipp: j["NIPP"] || j["NIP"] || "",
                                jabatan: j["Jabatan"] || j["JABATAN"] || "",
                                binaan: j["Binaan"] || j["BINAAN"] || "-",
                                mulaiBekerja: "-"
                            });
                        }
                    });

                    // 3. LOGIKA PENGURUTAN (SORTING) SESUAI HIERARKI JABATAN
                    combinedData.sort((a, b) => {
                        const rankA = JABATAN_RANK[String(a.jabatan).toUpperCase().trim()] || 99;
                        const rankB = JABATAN_RANK[String(b.jabatan).toUpperCase().trim()] || 99;

                        if (rankA !== rankB) {
                            return rankA - rankB; // Urutkan berdasarkan level hierarki
                        }
                        
                        // Jika jabatan sama, urutkan alfabetis berdasarkan Nama
                        return a.nama.localeCompare(b.nama);
                    });

                    renderTable(combinedData);
                } else {
                    Swal.fire("Error", "Gagal mengambil data dari Google Sheets", "error");
                }
            } catch (error) {
                Swal.fire("Error Koneksi", error.message, "error");
            }
        }

        function renderTable(dataList) {
            const tbody = document.getElementById("tableBody");
            if (dataList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px;">Data personel tidak ditemukan.</td></tr>`;
                return;
            }

            let html = "";
            dataList.forEach((item, idx) => {
                html += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td><strong>${item.nama}</strong></td>
                        <td>${item.nipp}</td>
                        <td>${item.jabatan || '-'}</td>
                        <td>${item.binaan || '-'}</td>
                        <td>${item.mulaiBekerja || '-'}</td>
                        <td style="text-align:center;">
                            <button class="btn-action btn-edit" onclick="openEditModal('${item.nipp}')"><i class="fa-solid fa-pen"></i> Edit</button>
                            <button class="btn-action btn-delete" onclick="deletePersonel(${item.rowIndexMulai}, ${item.rowIndexJabatan})"><i class="fa-solid fa-trash"></i> Hapus</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function filterTable() {
            const keyword = document.getElementById("searchInput").value.toLowerCase();
            const filtered = combinedData.filter(item => 
                String(item.nama).toLowerCase().includes(keyword) ||
                String(item.nipp).toLowerCase().includes(keyword) ||
                String(item.jabatan).toLowerCase().includes(keyword) ||
                String(item.binaan).toLowerCase().includes(keyword)
            );
            renderTable(filtered);
        }

        function openEditModal(nipp) {
            const item = combinedData.find(i => cleanNipp(i.nipp) === cleanNipp(nipp));
            if (!item) return;

            document.getElementById("modalTitle").innerText = "Edit Data Personel";
            document.getElementById("editRowIndexMulai").value = item.rowIndexMulai || "";
            document.getElementById("editRowIndexJabatan").value = item.rowIndexJabatan || "";
            
            document.getElementById("inputNama").value = item.nama;
            document.getElementById("inputNipp").value = item.nipp;
            document.getElementById("inputJabatan").value = item.jabatan;
            document.getElementById("inputBinaan").value = item.binaan && item.binaan !== "-" ? item.binaan : "-";
            document.getElementById("inputMulaiBekerja").value = parseToInputDate(item.mulaiBekerja);

            document.getElementById("personnelModal").style.display = "flex";
        }

        function openAddModal() {
            document.getElementById("modalTitle").innerText = "Tambah Personel Baru";
            document.getElementById("editRowIndexMulai").value = "";
            document.getElementById("editRowIndexJabatan").value = "";
            document.getElementById("personnelForm").reset();
            document.getElementById("personnelModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("personnelModal").style.display = "none";
        }

        // SIMPAN PERUBAHAN KE GOOGLE SHEETS
        document.getElementById("personnelForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btnSave = document.getElementById("btnSaveData");
            
            const rMulai = document.getElementById("editRowIndexMulai").value;
            const rJabatan = document.getElementById("editRowIndexJabatan").value;

            const inputNama = document.getElementById("inputNama").value;
            const inputNipp = document.getElementById("inputNipp").value;
            const inputJabatan = document.getElementById("inputJabatan").value;
            const inputBinaan = document.getElementById("inputBinaan").value;
            
            let rawMulai = document.getElementById("inputMulaiBekerja").value; // Format YYYY-MM-DD dari input type="date"
            let formattedMulai = "";
            if (rawMulai) {
                let parts = rawMulai.split("-");
                if (parts.length === 3) {
                    formattedMulai = `${parts[2]}/${parts[1]}/${parts[0]}`; // Konversi ke DD/MM/YYYY
                }
            }

            btnSave.disabled = true;
            btnSave.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;

            try {
                const requests = [];

                // 1. Simpan ke Sheet "Data Mulai Bekerja"
                requests.push(fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: rMulai ? "update" : "add",
                        sheetName: "Data Mulai Bekerja",
                        rowIndex: rMulai ? parseInt(rMulai, 10) : null,
                        data: {
                            "NAMA": inputNama,
                            "NIPP": inputNipp,
                            "MULAI BEKERJA": formattedMulai
                        }
                    })
                }));

                // 2. Simpan ke Sheet "Jabatan"
                requests.push(fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: rJabatan ? "update" : "add",
                        sheetName: "Jabatan",
                        rowIndex: rJabatan ? parseInt(rJabatan, 10) : null,
                        data: {
                            "NAMA": inputNama,
                            "NIPP": inputNipp,
                            "Jabatan": inputJabatan,
                            "Binaan": inputBinaan
                        }
                    })
                }));

                await Promise.all(requests);

                Swal.fire("Berhasil!", "Data personel berhasil diperbarui di Google Sheets!", "success");
                closeModal();
                fetchSpreadsheetData();
            } catch (error) {
                Swal.fire("Gagal", "Gagal memperbarui data: " + error.message, "error");
            } finally {
                btnSave.disabled = false;
                btnSave.innerText = "Simpan Perubahan";
            }
        });

        // HAPUS PERSONEL DARI KEDUA SHEET
        async function deletePersonel(rMulai, rJabatan) {
            const confirm = await Swal.fire({
                title: 'Hapus Personel?',
                text: 'Data personel ini akan dihapus dari seluruh sheet database.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Ya, Hapus'
            });

            if (confirm.isConfirmed) {
                try {
                    const deleteReqs = [];
                    if (rMulai) {
                        deleteReqs.push(fetch(APPS_SCRIPT_URL, {
                            method: "POST",
                            headers: { "Content-Type": "text/plain;charset=utf-8" },
                            body: JSON.stringify({ action: "delete", sheetName: "Data Mulai Bekerja", rowIndex: rMulai })
                        }));
                    }
                    if (rJabatan) {
                        deleteReqs.push(fetch(APPS_SCRIPT_URL, {
                            method: "POST",
                            headers: { "Content-Type": "text/plain;charset=utf-8" },
                            body: JSON.stringify({ action: "delete", sheetName: "Jabatan", rowIndex: rJabatan })
                        }));
                    }
                    await Promise.all(deleteReqs);
                    Swal.fire("Terhapus!", "Data berhasil dihapus.", "success");
                    fetchSpreadsheetData();
                } catch (error) {
                    Swal.fire("Gagal", error.message, "error");
                }
            }
        }

        document.getElementById('btn-toggle-menu')?.addEventListener('click', () => {
            document.getElementById('app-sidebar').classList.toggle('collapsed');
        });

        document.addEventListener("DOMContentLoaded", fetchSpreadsheetData);
    </script>
</body>
</html>
