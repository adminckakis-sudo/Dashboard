<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBPR - UPT Crew KA Kelas C Kisaran</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .app-layout-wrapper {
            display: flex;
            width: 100%;
            min-height: calc(100vh - 60px);
            overflow-x: hidden;
            box-sizing: border-box;
            position: relative;
        }

        .app-main-content {
            flex: 1 1 0%;
            min-width: 0;
            padding: 16px !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            width: 100%;
            margin-left: 0;
        }

        .slideshow-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .slideshow-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .slideshow-header {
            padding: 12px 14px;
            background: #121d42;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .slideshow-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            line-height: 1.3;
        }

        .slideshow-badge {
            background: var(--kai-orange, #f06400);
            color: #ffffff;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000000;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .slideshow-footer {
            padding: 10px 14px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: #64748b;
            flex-wrap: wrap;
            gap: 8px;
        }

        .external-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--kai-orange, #f06400);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        .external-link-btn:hover {
            color: #d95700;
            text-decoration: underline;
        }

        .app-sidebar {
            flex-shrink: 0 !important;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-sidebar.collapsed {
            width: 60px;
        }

        .app-sidebar:not(.collapsed) {
            width: 240px;
        }

        /* Responsive Mobile Extra Fixes */
        @media (max-width: 640px) {
            .app-main-content {
                padding: 10px !important;
            }

            .slideshow-card {
                border-radius: 8px;
            }

            .slideshow-header {
                padding: 10px 12px;
            }

            .slideshow-title {
                font-size: 0.85rem;
            }

            .slideshow-footer {
                padding: 8px 12px;
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }

            /* Overlay Sidebar di Layar Kecil Agar Konten Tidak Terhimpit */
            .app-sidebar:not(.collapsed) {
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 99;
                box-shadow: 4px 0 12px rgba(0,0,0,0.3);
            }
        }
    </style>
</head>
<body>

    <!-- TOP UTILITY BAR -->
    <header class="top-header" role="banner">
        <div class="top-header-inner" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="header-left-group" style="display: flex; align-items: center; gap: 14px;">
                <button onclick="toggleSidebar()" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 10px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;" title="Buka/Tutup Menu">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="brand-affiliation">
                    <span class="brand-text">DIVRE I SUMATERA UTARA &bull; UPT CREW KA KISARAN</span>
                </div> 
            </div>
        </div>
    </header>

    <!-- WRAPPER UTAMA -->
    <div class="app-layout-wrapper">
        
        <!-- SIDEBAR -->
        <aside class="app-sidebar collapsed" id="app-sidebar" aria-label="Sidebar Navigasi">
            <div>
                <div class="sidebar-section-title" style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--kai-orange); letter-spacing: 1px; margin-bottom: 14px; padding-left: 4px;">MENU UTAMA</div>
                
                <nav style="display: flex; flex-direction: column; gap: 6px;">
                    <a href="../index.html" class="sidebar-item" title="Homepage">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                        <span class="sidebar-text">Homepage</span>
                    </a>
                    <a href="./personel.html" class="sidebar-item active" title="Personel">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span class="sidebar-text">Personel</span>
                    </a>
                    <div class="sidebar-sub-menu" style="display: flex; flex-direction: column; gap: 2px; padding-left: 16px; margin-top: 2px; border-left: 2px solid rgba(240, 100, 0, 0.3);">
                        <a href="./ibpr.html" class="sidebar-sub-item" style="color:var(--kai-orange); text-decoration: none; padding: 6px 10px; font-size: 0.8rem; font-weight: 700; border-radius: 4px; transition: all 0.2s ease;">
                            <span class="sidebar-text">IBPR</span>
                        </a> 
                        <a href="./jadwal-dinasan.html" class="sidebar-sub-item" style="color:#cbd5e1; text-decoration: none; padding: 6px 10px; font-size: 0.8rem; font-weight: 700; border-radius: 4px; transition: all 0.2s ease;">
                            <span class="sidebar-text">O.241</span>
                        </a> 
                        <a href="./struktur-organisasi.html" class="sidebar-sub-item " style="color: #cbd5e1; text-decoration: none; padding: 6px 10px; font-size: 0.8rem; font-weight: 700; border-radius: 4px; transition: all 0.2s ease;">
                            <span class="sidebar-text">Struktur Organisasi</span>
                        </a>
                    </div>

                    <a href="../cuti/dashboard-cuti.html" class="sidebar-item" title="Dashboard Cuti">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                        <span class="sidebar-text">Cuti</span>
                    </a>

                    <a href="../sertifikasi/dashboard-sertifikasi.html" class="sidebar-item" title="Pantauan Sertifikasi">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
                            <circle cx="9" cy="10" r="2.5"></circle>
                            <path d="M15 8h2"></path>
                            <path d="M15 12h2"></path>
                            <path d="M7 16c0-1.5 1.5-2.5 3-2.5s3 1 3 2.5"></path>
                        </svg>
                        <span class="sidebar-text">Sertifikasi</span>
                    </a>
                </nav>    
            </div>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="app-main-content">
            <div class="slideshow-container">
                <div class="slideshow-card">
                    <div class="slideshow-header">
                        <h2 class="slideshow-title">
                        </h2>
                        <span class="slideshow-badge">Google Slides</span>
                    </div>
                    <div class="iframe-wrapper">
                        <iframe 
                            src="https://docs.google.com/presentation/d/1UhCG54yZMhYD_2dGuIUZbeoFFcmDw72n/embed?start=false&loop=false&delayms=3000" 
                            allowfullscreen="true" 
                            mozallowfullscreen="true" 
                            webkitallowfullscreen="true"
                            loading="lazy">
                        </iframe>
                    </div>
                    <div class="slideshow-footer">
                        <span>Gunakan kontrol dalam tayangan untuk navigasi.</span>
                        <a href="https://docs.google.com/presentation/d/1UhCG54yZMhYD_2dGuIUZbeoFFcmDw72n/edit?usp=sharing" target="_blank" class="external-link-btn">
                            Buka di Google Slides <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('app-sidebar');
            if (sidebar) sidebar.classList.toggle('collapsed');
        }
    </script>
</body>
</html>
