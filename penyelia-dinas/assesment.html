<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Laporan Dinas - UPT Crew KA Kisaran</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="shortcut icon" href="../favicon.ico">
  <link rel="apple-touch-icon" href="../favicon.ico">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background-image: linear-gradient(135deg, rgba(18, 29, 66, 0.88) 0%, rgba(28, 42, 95, 0.82) 100%), url('../assets/images/assesment.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    .topbar-profile-container {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 16px;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
    }

    .topbar-profile-info {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    .topbar-penyelia-nama {
      font-size: 0.85rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    .topbar-penyelia-meta {
      font-size: 0.72rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .topbar-penyelia-jabatan {
      font-size: 0.65rem;
      font-weight: 700;
      color: #ff9d5c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .topbar-penyelia-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--kai-orange, #F06400);
      background-color: #ffffff;
      flex-shrink: 0;
    }

    .btn-topbar-logout {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.5);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      margin-left: 4px;
    }

    .btn-topbar-logout:hover {
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
    }

    .form-page-container {
      max-width: 860px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .page-title-outer {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 6px;
      text-align: center;
    }

    .form-tab-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-tab-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .form-tab-btn:hover {
      background: rgba(240, 100, 0, 0.3);
      color: #ffffff;
      border-color: var(--kai-orange);
    }

    .form-tab-btn.active {
      background: var(--kai-orange, #F06400);
      color: #ffffff;
      border-color: var(--kai-orange);
      box-shadow: 0 4px 12px rgba(240, 100, 0, 0.35);
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .form-card {
      background-color: rgba(255, 255, 255, 0.96) !important;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4) !important;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25) !important;
      border-radius: var(--radius-md);
      padding: 26px 30px;
    }

    .form-grid-row {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
    }

    .form-grid-col {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      background-color: var(--surface-card);
      color: var(--text-primary);
    }

    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--kai-orange);
      box-shadow: 0 0 0 3px rgba(240, 100, 0, 0.15);
    }

    .readonly-input {
      background-color: var(--surface-subtle) !important;
      color: var(--text-muted) !important;
      cursor: not-allowed;
    }

    .uppercase-input {
      text-transform: uppercase;
    }

    .ts-control {
      padding: 4px 10px !important;
      border-radius: var(--radius-sm) !important;
      min-height: 38px !important;
      font-size: 0.85rem !important;
    }

    .btn-submit-kai {
      width: 100%;
      background-color: var(--kai-blue);
      color: var(--text-white);
      border: none;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }

    .btn-submit-kai:hover {
      background-color: var(--kai-blue-dark);
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      color: #cbd5e1;
      text-decoration: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.86rem;
    }

    .sidebar-item:hover, .sidebar-item.active {
      color: #ffffff;
      background: rgba(240, 100, 0, 0.25);
      border: 1px solid rgba(240, 100, 0, 0.45);
    }
    /* Wrapper untuk menaruh Bouncing Dot di dalam input TomSelect saat loading */
    .select-loading-wrap {
      position: relative;
      width: 100%;
    }
    .select-loading-wrap .bouncing-dots {
      position: absolute;
      right: 34px; /* tepat di sebelah kiri panah dropdown */
      top: 50%;
      transform: translateY(-50%);
      color: #F06400;
      z-index: 5;
      pointer-events: none;
    }
    /* Styling TomSelect saat disabled/loading agar tetap rapi seperti input sebelahnya */
    .ts-wrapper.disabled .ts-control {
      background-color: #f8fafc !important;
      color: #64748b !important;
      opacity: 1 !important;
      cursor: wait !important;
    }
  </style>
</head>
<body>

  <header class="top-header" role="banner">
    <div class="top-header-inner" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div class="header-left-group" style="display: flex; align-items: center; gap: 14px;">
        <button onclick="toggleSidebar()" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 10px; border-radius: 4px; cursor: pointer;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <span class="brand-text">DIVRE I SUMATERA UTARA &bull; UPT CREW KA KISARAN</span>
      </div>

      <div class="topbar-right" style="display: flex; align-items: center; gap: 12px;">
        <!-- KONTAINER PROFIL PENYELIA -->
        <div class="topbar-profile-container">
          <div class="topbar-profile-info">
            <span id="penyeliaNama" class="topbar-penyelia-nama">--</span>
            <span id="penyeliaNipp" class="topbar-penyelia-meta">NIPP. --</span>
            <span id="penyeliaJabatan" class="topbar-penyelia-jabatan">--</span>
          </div>
          <img id="penyeliaFoto" src="https://via.placeholder.com/150" alt="Foto" class="topbar-penyelia-avatar">
        </div>

        <!-- TOMBOL EDIT DATA (POSISI SESUAI TANDA) -->
        <a href="./edit.html" style="background: rgba(240, 100, 0, 0.25); color: #ff9d5c; border: 1px solid rgba(240, 100, 0, 0.5); padding: 7px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 5px; transition: all 0.2s;" onmouseover="this.style.background='rgba(240,100,0,0.8)'; this.style.color='#fff';" onmouseout="this.style.background='rgba(240,100,0,0.25)'; this.style.color='#ff9d5c';" title="Buka Halaman Edit Data">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          Edit Data
        </a>

        <!-- TOMBOL KELUAR -->
        <button type="button" class="btn-topbar-logout" onclick="handleLogout()">Keluar</button>
      </div>
    </div>
  </header>

  <div class="app-layout-wrapper">
  <aside class="app-sidebar collapsed no-print" id="app-sidebar" aria-label="Sidebar Navigasi">
      <div>
        <div class="sidebar-section-title" style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--kai-orange, #F06400); letter-spacing: 1px; margin-bottom: 14px; padding-left: 4px;">MENU UTAMA</div>
        
        <nav style="display: flex; flex-direction: column; gap: 16px;">
          <a href="../index.html" class="sidebar-item" title="Homepage">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>

        <a href="./premi.html" class="sidebar-item" title="Cetak Report G43A">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>

    <main class="app-main-content">
      <div class="dashboard-content form-page-container">
        <!-- TAB SWITCHER -->
        <div class="form-tab-container">
          <button type="button" class="form-tab-btn" id="btnTabAwal" onclick="switchForm('awal')">Form Awal Dinas</button>
          <button type="button" class="form-tab-btn active" id="btnTabAkhir" onclick="switchForm('akhir')">Form Akhir Dinas</button>
          <button type="button" class="form-tab-btn" id="btnTabLangsir" onclick="switchForm('langsir')">Langsir / Serep</button>
        </div>

        <!-- FORM AWAL DINAS -->
        <div id="sectionAwalDinas" class="form-section">
          <div class="form-card">
            <form id="formAwalDinas">
              <h3 style="margin-top:0; margin-bottom:16px; font-size:1.1rem; color:var(--kai-blue);">Input Data Awal Dinas</h3>
              <div class="form-grid-row">
                <div class="form-grid-col">
                  <label class="form-label">No. KA</label>
                  <input type="text" id="noKaAwal" class="form-input uppercase-input" placeholder="U99" required>
                </div>
                <div class="form-grid-col">
                  <label class="form-label">No. Lokomotif</label>
                  <input type="text" id="noLokomotifAwal" class="form-input uppercase-input" placeholder="CC2017704">
                </div>
              </div>

              <div class="form-grid-row">
                <div class="form-grid-col">
                  <label class="form-label">Masinis</label>
                  <select id="masinisAwal" placeholder="Cari atau Ketik NAMA - NIPP..."></select>
                </div>
                <div class="form-grid-col">
                  <label class="form-label">Kedudukan Masinis</label>
                  <select id="kedudukanMasinisAwal" class="form-select">
                    <option value="">Pilih Kedudukan...</option>
                    <option value="UPT CREW KA KIS">UPT CREW KA KIS</option>
                    <option value="UPT CREW KA TBI">UPT CREW KA TBI</option>
                    <option value="UPT CREW KA MDN">UPT CREW KA MDN</option>
                  </select>
                </div>
              </div>

              <div class="form-grid-row">
                <div class="form-grid-col">
                  <label class="form-label">Asisten Masinis</label>
                  <select id="asistenMasinisAwal" placeholder="Cari atau Ketik NAMA - NIPP..."></select>
                </div>
                <div class="form-grid-col">
                  <label class="form-label">Kedudukan Asisten Masinis</label>
                  <select id="kedudukanAsistenAwal" class="form-select">
                    <option value="">Pilih Kedudukan...</option>
                    <option value="UPT CREW KA KIS">UPT CREW KA KIS</option>
                    <option value="UPT CREW KA TBI">UPT CREW KA TBI</option>
                    <option value="UPT CREW KA MDN">UPT CREW KA MDN</option>
                  </select>
                </div>
              </div>

              <div class="form-grid-row">
                <div class="form-grid-col">
                  <label class="form-label">Tonase</label>
                  <input type="text" id="tonaseAwal" class="form-input" placeholder="350">
                </div>
                <div class="form-grid-col">
                  <label class="form-label">Keterangan</label>
                  <input type="text" id="keteranganAwal" class="form-input" placeholder="-">
                </div>
              </div>

              <button type="submit" class="btn-submit-kai" id="btnSubmitAwal">Kirim Laporan Awal Dinas</button>
            </form>
          </div>
        </div>

        <!-- FORM AKHIR DINAS -->
        <div id="sectionAkhirDinas" class="form-section active">
          <div class="form-card">
            <form id="formAkhirDinas">
              <h3 style="margin-top:0; margin-bottom:16px; font-size:1.1rem; color:var(--kai-blue);">Input Data Akhir Dinas</h3>
              <div class="form-grid-row">
                <div class="form-grid-col">
                  <label class="form-label">No. KA</label>
                  <input type="text" id="noKa" class="form-input uppercase-input" placeholder="U99" required>
                </div>
                <div class="form-grid-col">
                  <label class="form-label">No. Lokomotif</label>
                  <input type="text" id="noLokomotif" class="form-input uppercase-input" placeholder="CC2017704">
                </div>
              </div>

              <div class="form-grid-row">
                <div class="form-grid-col">
                  <label class="form-label">Jam Datang (WIB)</label>
                  <input type="text" id="jamDatang" class="form-input" placeholder="2237" >
                </div>
                <div class="form-grid-col">
                  <label class="form-label">Lambat (Menit)</label>
                  <input type="text" id="lambat" class="form-input" value="0" >
                </div>
              </div>

              <div class="form-grid-row">
                <div class="form-grid-col">
                  <label class="form-label">Masinis</label>
                  <select id="masinis" placeholder="Cari atau Ketik NAMA - NIPP..."></select>
                </div>
                <div class="form-grid-col">
                  <label class="form-label">Kedudukan Masinis</label>
                  <select id="kedudukanMasinis" class="form-select">
                    <option value="">Pilih Kedudukan...</option>
                    <option value="UPT CREW KA KIS">UPT CREW KA KIS</option>
                    <option value="UPT CREW KA TBI">UPT CREW KA TBI</option>
                    <option value="UPT CREW KA MDN">UPT CREW KA MDN</option>
                  </select>
                </div>
              </div>

              <div class="form-grid-row">
                <div class="form-grid-col">
                  <label class="form-label">Asisten Masinis</label>
                  <select id="asistenMasinis" placeholder="Cari atau Ketik NAMA - NIPP..."></select>
                </div>
                <div class="form-grid-col">
                  <label class="form-label">Kedudukan Asisten Masinis</label>
                  <select id="kedudukanAsisten" class="form-select">
                    <option value="">Pilih Kedudukan...</option>
                    <option value="UPT CREW KA KIS">UPT CREW KA KIS</option>
                    <option value="UPT CREW KA TBI">UPT CREW KA TBI</option>
                    <option value="UPT CREW KA MDN">UPT CREW KA MDN</option>
                  </select>
                </div>
              </div>

              <div class="form-grid-row">
                <div class="form-grid-col">
                  <label class="form-label">Kejadian Selama Perjalanan</label>
                  <input type="text" id="kejadian" class="form-input" rows="2" placeholder="-">
                </div>
                <div class="form-grid-col">
                  <label class="form-label">Keterangan Tambahan</label>
                  <input type="text" id="keterangan" class="form-input" placeholder="-">
                </div>
              </div>

              <button type="submit" class="btn-submit-kai" id="btnSubmit">Kirim Laporan Akhir Dinas</button>
            </form>
          </div>
        </div>

        <!-- FORM LANGSIR / SEREP -->
        <div id="sectionLangsirSerep" class="form-section">
          <div class="form-card">
            <form id="formLangsirSerep">
              <h3 style="margin-top:0; margin-bottom:16px; font-size:1.1rem; color:var(--kai-blue);">Input Data Langsir / Serep</h3>

              <div class="form-grid-row">
                <div class="form-grid-col">
                  <label class="form-label">Dinasan</label>
                  <select id="dinasanLangsir" class="form-select" required>
                    <option value="">Pilih Dinasan...</option>
                    <option value="Serep Pagi">Serep Pagi</option>
                    <option value="Serep Siang">Serep Siang</option>
                    <option value="Langsir Pagi">Langsir Pagi</option>
                    <option value="Langsir Siang">Langsir Siang</option>
                    <option value="Langsir Malam">Langsir Malam</option>
                    <option value="Serep Pagi-LD U53">Serep Pagi - LD U53 (Serep RAP)</option>
                    <option value="LD U52 - Serep RAP">LD U52 - Serep Siang (Serep RAP)</option>
                  </select>
                </div>
                <div class="form-grid-col">
                  <label class="form-label">Keterangan Tambahan</label>
                  <input type="text" id="keteranganLangsir" class="form-input" placeholder="-">
                </div>
              </div>

              <div class="form-grid-row">
                <div class="form-grid-col">
                  <label class="form-label">Masinis</label>
                  <select id="masinisLangsir" placeholder="Cari atau Ketik NAMA - NIPP..."></select>
                </div>
                <div class="form-grid-col">
                  <label class="form-label">Kedudukan Masinis</label>
                  <select id="kedudukanMasinisLangsir" class="form-select">
                    <option value="">Pilih Kedudukan...</option>
                    <option value="UPT CREW KA KIS">UPT CREW KA KIS</option>
                    <option value="UPT CREW KA TBI">UPT CREW KA TBI</option>
                    <option value="UPT CREW KA MDN">UPT CREW KA MDN</option>
                  </select>
                </div>
              </div>

              <div class="form-grid-row">
                <div class="form-grid-col">
                  <label class="form-label">Asisten Masinis</label>
                  <select id="asistenMasinisLangsir" placeholder="Cari atau Ketik NAMA - NIPP..."></select>
                </div>
                <div class="form-grid-col">
                  <label class="form-label">Kedudukan Asisten Masinis</label>
                  <select id="kedudukanAsistenLangsir" class="form-select">
                    <option value="">Pilih Kedudukan...</option>
                    <option value="UPT CREW KA KIS">UPT CREW KA KIS</option>
                    <option value="UPT CREW KA TBI">UPT CREW KA TBI</option>
                    <option value="UPT CREW KA MDN">UPT CREW KA MDN</option>
                  </select>
                </div>
              </div>

              <button type="submit" class="btn-submit-kai" id="btnSubmitLangsir">Kirim Laporan</button>
            </form>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

  <script>
    const loggedInNama = localStorage.getItem("loggedInUserNama");
    const loggedInNipp = localStorage.getItem("loggedInUserNipp");
    const loggedInJabatan = localStorage.getItem("loggedInUserJabatan");

    if (!loggedInNama || !loggedInNipp) {
      Swal.fire({ title: 'Akses Ditolak!', text: 'Login terlebih dahulu.', icon: 'warning', confirmButtonColor: '#1C2A5F' }).then(() => {
        window.location.href = "login.html";
      });
    }

    function handleLogout() {
      Swal.fire({
        title: 'Konfirmasi Logout',
        text: 'Apakah Anda yakin ingin keluar dari sistem?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Ya, Logout',
        cancelButtonText: 'Batal'
      }).then((result) => {
        if (result.isConfirmed) {
          localStorage.clear();
          Swal.fire({
            title: 'Berhasil Keluar',
            text: 'Mengalihkan ke halaman login...',
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            window.location.href = "login.html";
          });
        }
      });
    }

    function switchForm(type) {
      document.getElementById("btnTabAwal").classList.toggle("active", type === 'awal');
      document.getElementById("btnTabAkhir").classList.toggle("active", type === 'akhir');
      document.getElementById("btnTabLangsir").classList.toggle("active", type === 'langsir');
      document.getElementById("sectionAwalDinas").classList.toggle("active", type === 'awal');
      document.getElementById("sectionAkhirDinas").classList.toggle("active", type === 'akhir');
      document.getElementById("sectionLangsirSerep").classList.toggle("active", type === 'langsir');
    }

    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("penyeliaNama").textContent = loggedInNama || "--";
      document.getElementById("penyeliaNipp").textContent = "NIPP. " + (loggedInNipp || "--");
      document.getElementById("penyeliaJabatan").textContent = loggedInJabatan || "PENYELIA";

      const imgEl = document.getElementById("penyeliaFoto");
      if (imgEl && loggedInNipp) {
        const cleanNipp = String(loggedInNipp).trim();
        const jpgPath = `../assets/struktur-organisasi/${cleanNipp}.jpg`;
        const pngPath = `../assets/struktur-organisasi/${cleanNipp}.png`;
        const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(loggedInNama)}&background=1C2A5F&color=fff`;

        imgEl.src = jpgPath;
        imgEl.onerror = function() {
          if (this.src.endsWith(".jpg")) {
            this.src = pngPath;
          } else {
            this.src = defaultAvatar;
          }
        };
      }

      loadInitialData();
    });

    const API_URL = "https://script.google.com/macros/s/AKfycbw-9fcXYIGwoZDP5UZExzNI_nWOdwGlM_j-8lRDn4PjIinkVD0Z6km_ohjiy5tDKSh6aQ/exec";
    let crewKedudukanMap = {};
    let tsInstances = {};

    async function loadInitialData() {
      const selectIds = ["masinis", "asistenMasinis", "masinisAwal", "asistenMasinisAwal", "masinisLangsir", "asistenMasinisLangsir"];
      tsInstances = {};

      // 1. Langsung ubah semua <select> menjadi TomSelect (tampilan seragam sejak awal)
      selectIds.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;

        // Bungkus elemen agar Bouncing Dot muncul di dalam kotak input
        const wrapper = document.createElement("div");
        wrapper.className = "select-loading-wrap";
        el.parentNode.insertBefore(wrapper, el);
        wrapper.appendChild(el);
        wrapper.insertAdjacentHTML(
          "beforeend",
          `<span class="bouncing-dots crew-loader"><span></span><span></span><span></span></span>`
        );

        const ts = new TomSelect(el, {
          options: [],
          create: function(input) {
            const cleanInput = input.trim().toUpperCase();
            return { value: cleanInput, text: cleanInput };
          },
          placeholder: "Memuat daftar awak KA..."
        });
        ts.disable(); // Kunci sementara selama fetch berlangsung
        tsInstances[id] = ts;
      });

      // 2. Satu kali fetch saja (memperbaiki double fetch sebelumnya)
      try {
        const res = await fetch(API_URL + "?action=getFormDinasData");
        const data = await res.json();

        if (data.status === "success" || data.result === "success") {
          const crewOptions = (data.crew || []).map(item => ({ value: item, text: item }));
          crewKedudukanMap = data.crewDetails || {};

          // Masukkan opsi ke semua instance TomSelect dan aktifkan kembali
          Object.entries(tsInstances).forEach(([id, ts]) => {
            ts.addOptions(crewOptions);
            ts.settings.placeholder = "Cari atau Ketik NAMA - NIPP...";
            ts.inputState();
            ts.enable();
          });

          // Pasang listener otomatis isi Kedudukan
          tsInstances.masinis?.on("change", v => {
            if (crewKedudukanMap[v]) document.getElementById("kedudukanMasinis").value = crewKedudukanMap[v];
          });
          tsInstances.asistenMasinis?.on("change", v => {
            if (crewKedudukanMap[v]) document.getElementById("kedudukanAsisten").value = crewKedudukanMap[v];
          });
          tsInstances.masinisAwal?.on("change", v => {
            if (crewKedudukanMap[v]) document.getElementById("kedudukanMasinisAwal").value = crewKedudukanMap[v];
          });
          tsInstances.asistenMasinisAwal?.on("change", v => {
            if (crewKedudukanMap[v]) document.getElementById("kedudukanAsistenAwal").value = crewKedudukanMap[v];
          });
          tsInstances.masinisLangsir?.on("change", v => {
            if (crewKedudukanMap[v]) document.getElementById("kedudukanMasinisLangsir").value = crewKedudukanMap[v];
          });
          tsInstances.asistenMasinisLangsir?.on("change", v => {
            if (crewKedudukanMap[v]) document.getElementById("kedudukanAsistenLangsir").value = crewKedudukanMap[v];
          });
        }
      } catch (err) {
        console.error("Gagal memuat data awak KA:", err);
        // Jika gagal fetch, tetap buka kunci agar user bisa ketik manual
        Object.values(tsInstances).forEach(ts => {
          ts.settings.placeholder = "Gagal memuat. Ketik manual NAMA - NIPP...";
          ts.inputState();
          ts.enable();
        });
      } finally {
        // Hapus indikator Bouncing Dot setelah selesai
        document.querySelectorAll(".crew-loader").forEach(el => el.remove());
      }
    }

    // Submit Awal Dinas
    document.getElementById("formAwalDinas").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmitAwal");
      btn.disabled = true; 
      btn.innerHTML = `<span class="spinner-arch"></span> Menyimpan Laporan...`;

      const payload = {
        action: "submitFormAwalDinas",
        noKa: document.getElementById("noKaAwal").value,
        noLokomotif: document.getElementById("noLokomotifAwal").value,
        masinis: document.getElementById("masinisAwal").value || "-",
        asistenMasinis: document.getElementById("asistenMasinisAwal").value || "-",
        kedudukan: (document.getElementById("kedudukanMasinisAwal").value || "-") + " / " + (document.getElementById("kedudukanAsistenAwal").value || "-"),
        tonase: document.getElementById("tonaseAwal").value || "0",
        keterangan: document.getElementById("keteranganAwal").value || "-",
        penyelia: loggedInNama,
        penyeliaNipp: loggedInNipp
      };

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await res.json();
        if (result.status === "success") {
          Swal.fire('Berhasil', 'Data Awal Dinas tersimpan.', 'success');
          document.getElementById("formAwalDinas").reset();
          document.getElementById("kedudukanMasinisAwal").value = "";
          document.getElementById("kedudukanAsistenAwal").value = "";
        } else {
          Swal.fire('Gagal', result.message, 'error');
        }
      } catch (err) {
        Swal.fire('Kesalahan Jaringan', 'Gagal terhubung ke server.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Kirim Laporan Awal Dinas";
      }
    });

    // Submit Akhir Dinas
    document.getElementById("formAkhirDinas").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      btn.disabled = true; 
      btn.innerHTML = `<span class="spinner-arch"></span> Menyimpan Laporan...`;

      const payload = {
        action: "submitFormAkhirDinas",
        noKa: document.getElementById("noKa").value,
        noLokomotif: document.getElementById("noLokomotif").value,
        jamDatang: document.getElementById("jamDatang").value,
        lambat: document.getElementById("lambat").value,
        masinis: document.getElementById("masinis").value || "-",
        asistenMasinis: document.getElementById("asistenMasinis").value || "-",
        kedudukan: (document.getElementById("kedudukanMasinis").value || "-") + " / " + (document.getElementById("kedudukanAsisten").value || "-"),
        kejadian: document.getElementById("kejadian").value || "-",
        keterangan: document.getElementById("keterangan").value || "-",
        penyelia: loggedInNama,
        penyeliaNipp: loggedInNipp
      };

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await res.json();
        if (result.status === "success") {
          Swal.fire('Berhasil', 'Data Akhir Dinas tersimpan.', 'success');
          document.getElementById("formAkhirDinas").reset();
          document.getElementById("kedudukanMasinis").value = "";
          document.getElementById("kedudukanAsisten").value = "";
        } else {
          Swal.fire('Gagal', result.message, 'error');
        }
      } catch (err) {
        Swal.fire('Kesalahan Jaringan', 'Gagal terhubung ke server.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Kirim Laporan Akhir Dinas";
      }
    });

    // Submit Langsir / Serep (selalu membuat baris/entri baru, tidak menimpa data yang sudah ada)
    document.getElementById("formLangsirSerep").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmitLangsir");
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-arch"></span> Menyimpan Laporan...`;

      const dinasanVal = document.getElementById("dinasanLangsir").value;
      const masinisVal = document.getElementById("masinisLangsir").value || "-";
      const asistenVal = document.getElementById("asistenMasinisLangsir").value || "-";
      const kedudukanMasVal = document.getElementById("kedudukanMasinisLangsir").value || "-";
      const kedudukanAsmasVal = document.getElementById("kedudukanAsistenLangsir").value || "-";
      const keteranganVal = document.getElementById("keteranganLangsir").value || "-";

      const payload = {
        action: "submitFormLangsirSerep",
        appendOnly: true,
        noKa: dinasanVal,
        dinasan: dinasanVal,
        masinis: masinisVal,
        asistenMasinis: asistenVal,
        kedudukanMasinis: kedudukanMasVal,
        kedudukanAsisten: kedudukanAsmasVal,
        kedudukan: kedudukanMasVal + " / " + kedudukanAsmasVal,
        keterangan: keteranganVal,
        penyelia: loggedInNama,
        penyeliaNipp: loggedInNipp
      };

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await res.json();
        if (result.status === "success" || result.result === "success") {
          Swal.fire('Berhasil', 'Data Tersimpan.', 'success');
          document.getElementById("formLangsirSerep").reset();
          document.getElementById("kedudukanMasinisLangsir").value = "";
          document.getElementById("kedudukanAsistenLangsir").value = "";
          tsInstances.masinisLangsir?.clear(true);
          tsInstances.asistenMasinisLangsir?.clear(true);
        } else {
          Swal.fire('Gagal', result.message || 'Gagal menyimpan data.', 'error');
        }
      } catch (err) {
        Swal.fire('Kesalahan Jaringan', 'Gagal terhubung ke server.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Kirim Laporan";
      }
    });

    function toggleSidebar() { 
      document.getElementById('app-sidebar').classList.toggle('collapsed'); 
    }
  </script>
</body>
</html>
