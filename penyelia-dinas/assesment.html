<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Laporan Dinas - UPT Crew KA Kisaran</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background-image: linear-gradient(135deg, rgba(18, 29, 66, 0.88) 0%, rgba(28, 42, 95, 0.82) 100%), url('../assets/images/assesment.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    .topbar-profile-container {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 16px;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
    }

    .topbar-profile-info {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    .topbar-penyelia-nama {
      font-size: 0.85rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    .topbar-penyelia-meta {
      font-size: 0.72rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .topbar-penyelia-jabatan {
      font-size: 0.65rem;
      font-weight: 700;
      color: #ff9d5c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .topbar-penyelia-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--kai-orange, #F06400);
      background-color: #ffffff;
      flex-shrink: 0;
    }

    .btn-topbar-logout {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.5);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      margin-left: 4px;
    }

    .btn-topbar-logout:hover {
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
    }

    .form-page-container {
      max-width: 860px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .page-title-outer {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 6px;
      text-align: center;
    }

    .form-tab-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-tab-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .form-tab-btn:hover {
      background: rgba(240, 100, 0, 0.3);
      color: #ffffff;
      border-color: var(--kai-orange);
    }

    .form-tab-btn.active {
      background: var(--kai-orange, #F06400);
      color: #ffffff;
      border-color: var(--kai-orange);
      box-shadow: 0 4px 12px rgba(240, 100, 0, 0.35);
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .form-card {
      background-color: rgba(255, 255, 255, 0.96) !important;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4) !important;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25) !important;
      border-radius: var(--radius-md);
      padding: 26px 30px;
    }

    .form-grid-row {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
    }

    .form-grid-col {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      background-color: var(--surface-card);
      color: var(--text-primary);
    }

    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--kai-orange);
      box-shadow: 0 0 0 3px rgba(240, 100, 0, 0.15);
    }

    .readonly-input {
      background-color: var(--surface-subtle) !important;
      color: var(--text-muted) !important;
      cursor: not-allowed;
    }

    .uppercase-input {
      text-transform: uppercase;
    }

    .ts-control {
      padding: 4px 10px !important;
      border-radius: var(--radius-sm) !important;
      min-height: 38px !important;
      font-size: 0.85rem !important;
    }

    .btn-submit-kai {
      width: 100%;
      background-color: var(--kai-blue);
      color: var(--text-white);
      border: none;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }

    .btn-submit-kai:hover {
      background-color: var(--kai-blue-dark);
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      color: #cbd5e1;
      text-decoration: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.86rem;
    }

    .sidebar-item:hover, .sidebar-item.active {
      color: #ffffff;
      background: rgba(240, 100, 0, 0.25);
      border: 1px solid rgba(240, 100, 0, 0.45);
    }
  </style>
</head>

        <!-- TAB SWITCHER -->

          <button type="button" class="form-tab-btn" id="btnTabAwal" onclick="switchForm('awal')">Form Awal Dinas</button>

  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  <script>
    const loggedInNama = localStorage.getItem("loggedInUserNama");
    const loggedInNipp = localStorage.getItem("loggedInUserNipp");
    const loggedInJabatan = localStorage.getItem("loggedInUserJabatan");

    if (!loggedInNama || !loggedInNipp) {
      Swal.fire({ title: 'Akses Ditolak!', text: 'Login terlebih dahulu.', icon: 'warning', confirmButtonColor: '#1C2A5F' }).then(() => {
        window.location.href = "login.html";
      });
    }

    function handleLogout() {
      Swal.fire({
        title: 'Konfirmasi Logout',
        text: 'Apakah Anda yakin ingin keluar dari sistem?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Ya, Logout',
        cancelButtonText: 'Batal'
      }).then((result) => {
        if (result.isConfirmed) {
          localStorage.clear();
          Swal.fire({
            title: 'Berhasil Keluar',
            text: 'Mengalihkan ke halaman login...',
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            window.location.href = "login.html";
          });
        }
      });
    }

    function switchForm(type) {
      document.getElementById("btnTabAwal").classList.toggle("active", type === 'awal');
      document.getElementById("btnTabAkhir").classList.toggle("active", type === 'akhir');
      document.getElementById("sectionAwalDinas").classList.toggle("active", type === 'awal');
      document.getElementById("sectionAkhirDinas").classList.toggle("active", type === 'akhir');
    }

    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("penyeliaNama").textContent = loggedInNama || "--";
      document.getElementById("penyeliaNipp").textContent = "NIPP. " + (loggedInNipp || "--");
      document.getElementById("penyeliaJabatan").textContent = loggedInJabatan || "PENYELIA";

      const imgEl = document.getElementById("penyeliaFoto");
      if (imgEl && loggedInNipp) {
        const cleanNipp = String(loggedInNipp).trim();
        const jpgPath = `../assets/struktur-organisasi/${cleanNipp}.jpg`;
        const pngPath = `../assets/struktur-organisasi/${cleanNipp}.png`;
        const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(loggedInNama)}&background=1C2A5F&color=fff`;

        imgEl.src = jpgPath;
        imgEl.onerror = function() {
          if (this.src.endsWith(".jpg")) {
            this.src = pngPath;
          } else {
            this.src = defaultAvatar;
          }
        };
      }

      loadInitialData();
    });

    const API_URL = "https://script.google.com/macros/s/AKfycbycTmSZR5MyhRkhrP-T_JqRlOuL56DkquxPJPmMLTXCuZjbwcgLdRJpsFJTX6ZeKEEr1A/exec";
    let crewKedudukanMap = {};

    async function loadInitialData() {
      try {
        const res = await fetch(API_URL + "?action=getFormDinasData");
        const data = await res.json();
        
        if (data.status === "success" || data.result === "success") {
          const crewOptions = (data.crew || []).map(item => ({ value: item, text: item }));
          crewKedudukanMap = data.crewDetails || {};

          // Helper konfigurasi TomSelect dengan fitur create manual (format NAMA - NIPP)
          const tsConfig = {
            options: crewOptions,
            create: function(input) {
              const cleanInput = input.trim().toUpperCase();
              return { value: cleanInput, text: cleanInput };
            },
            placeholder: "Cari atau Ketik NAMA - NIPP..."
          };

          const tsMasinis = new TomSelect("#masinis", tsConfig);
          tsMasinis.on('change', v => {
            if (crewKedudukanMap[v]) document.getElementById("kedudukanMasinis").value = crewKedudukanMap[v];
          });

          const tsAsisten = new TomSelect("#asistenMasinis", tsConfig);
          tsAsisten.on('change', v => {
            if (crewKedudukanMap[v]) document.getElementById("kedudukanAsisten").value = crewKedudukanMap[v];
          });

          const tsMasinisAwal = new TomSelect("#masinisAwal", tsConfig);
          tsMasinisAwal.on('change', v => {
            if (crewKedudukanMap[v]) document.getElementById("kedudukanMasinisAwal").value = crewKedudukanMap[v];
          });

          const tsAsistenAwal = new TomSelect("#asistenMasinisAwal", tsConfig);
          tsAsistenAwal.on('change', v => {
            if (crewKedudukanMap[v]) document.getElementById("kedudukanAsistenAwal").value = crewKedudukanMap[v];
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Submit Awal Dinas
    document.getElementById("formAwalDinas").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmitAwal");
      btn.disabled = true; btn.innerText = "Menyimpan...";

      const payload = {
        action: "submitFormAwalDinas",
        noKa: document.getElementById("noKaAwal").value,
        noLokomotif: document.getElementById("noLokomotifAwal").value,
        masinis: document.getElementById("masinisAwal").value || "-",
        asistenMasinis: document.getElementById("asistenMasinisAwal").value || "-",
        kedudukan: (document.getElementById("kedudukanMasinisAwal").value || "-") + " / " + (document.getElementById("kedudukanAsistenAwal").value || "-"),
        tonase: document.getElementById("tonaseAwal").value || "0",
        keterangan: document.getElementById("keteranganAwal").value || "-",
        penyelia: loggedInNama,
        penyeliaNipp: loggedInNipp
      };

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await res.json();
        if (result.status === "success") {
          Swal.fire('Berhasil', 'Data Awal Dinas tersimpan.', 'success');
          document.getElementById("formAwalDinas").reset();
          document.getElementById("kedudukanMasinisAwal").value = "";
          document.getElementById("kedudukanAsistenAwal").value = "";
        } else {
          Swal.fire('Gagal', result.message, 'error');
        }
      } catch (err) {
        Swal.fire('Kesalahan Jaringan', 'Gagal terhubung ke server.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = "Kirim Laporan Awal Dinas";
      }
    });

    // Submit Akhir Dinas
    document.getElementById("formAkhirDinas").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      btn.disabled = true; btn.innerText = "Menyimpan...";

      const payload = {
        action: "submitFormAkhirDinas",
        noKa: document.getElementById("noKa").value,
        noLokomotif: document.getElementById("noLokomotif").value,
        jamDatang: document.getElementById("jamDatang").value,
        lambat: document.getElementById("lambat").value,
        masinis: document.getElementById("masinis").value || "-",
        asistenMasinis: document.getElementById("asistenMasinis").value || "-",
        kedudukan: (document.getElementById("kedudukanMasinis").value || "-") + " / " + (document.getElementById("kedudukanAsisten").value || "-"),
        kejadian: document.getElementById("kejadian").value || "-",
        keterangan: document.getElementById("keterangan").value || "-",
        penyelia: loggedInNama,
        penyeliaNipp: loggedInNipp
      };

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await res.json();
        if (result.status === "success") {
          Swal.fire('Berhasil', 'Data Akhir Dinas tersimpan.', 'success');
          document.getElementById("formAkhirDinas").reset();
          document.getElementById("kedudukanMasinis").value = "";
          document.getElementById("kedudukanAsisten").value = "";
        } else {
          Swal.fire('Gagal', result.message, 'error');
        }
      } catch (err) {
        Swal.fire('Kesalahan Jaringan', 'Gagal terhubung ke server.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = "Kirim Laporan Akhir Dinas";
      }
    });

    function toggleSidebar() { 
      document.getElementById('app-sidebar').classList.toggle('collapsed'); 
    }
  </script>
