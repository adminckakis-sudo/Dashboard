<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit & Kelola Laporan Dinas - UPT Crew KA Kisaran</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background-image: linear-gradient(135deg, rgba(18, 29, 66, 0.9) 0%, rgba(28, 42, 95, 0.85) 100%), url('../assets/images/assesment.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      font-family: 'Montserrat', sans-serif;
      color: #0f172a;
      margin: 0;
      padding: 0;
    }

    /* TOPBAR PROFIL */
    .topbar-profile-container {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 16px;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
    }
    .topbar-profile-info { display: flex; flex-direction: column; text-align: right; }
    .topbar-penyelia-nama { font-size: 0.85rem; font-weight: 800; color: #ffffff; line-height: 1.2; }
    .topbar-penyelia-meta { font-size: 0.72rem; color: #cbd5e1; font-weight: 600; }
    .topbar-penyelia-jabatan { font-size: 0.65rem; font-weight: 700; color: #ff9d5c; text-transform: uppercase; letter-spacing: 0.5px; }
    .topbar-penyelia-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--kai-orange, #F06400); background-color: #ffffff; flex-shrink: 0; }

    .btn-topbar-logout {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.5);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      margin-left: 4px;
    }
    .btn-topbar-logout:hover { background: rgba(239, 68, 68, 0.9); color: #ffffff; }

    /* LAYOUT UTAMA */
    .form-page-container {
      max-width: 1250px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .page-title-outer {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 12px;
      text-align: center;
    }

    /* TAB SWITCHER */
    .form-tab-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .form-tab-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 22px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .form-tab-btn:hover { background: rgba(240, 100, 0, 0.3); color: #ffffff; border-color: var(--kai-orange); }
    .form-tab-btn.active { background: var(--kai-orange, #F06400); color: #ffffff; border-color: var(--kai-orange); box-shadow: 0 4px 12px rgba(240, 100, 0, 0.35); }

    /* KARTU FILTER */
    .filter-card {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 12px;
      padding: 18px 24px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      flex-wrap: wrap;
    }

    .filter-group { display: flex; align-items: center; gap: 12px; }
    .filter-label { font-size: 0.85rem; font-weight: 700; color: #334155; }
    .filter-input { padding: 9px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; font-family: inherit; outline: none; }
    .filter-input:focus { border-color: var(--kai-orange, #F06400); box-shadow: 0 0 0 3px rgba(240, 100, 0, 0.15); }
    
    .btn-load {
      background-color: #1C2A5F;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-load:hover { background-color: #121d42; }

    /* KARTU & TABEL DATA */
    .table-card {
      background-color: rgba(255, 255, 255, 0.98);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .edit-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .edit-table th {
      background-color: #1C2A5F;
      color: white;
      padding: 12px 10px;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #0f172a;
    }
    .edit-table td {
      border-bottom: 1px solid #e2e8f0;
      border-right: 1px solid #f1f5f9;
      padding: 8px 10px;
      text-align: center;
      vertical-align: middle;
      background-color: #ffffff;
    }
    .edit-table tr:hover td {
      background-color: #f8fafc;
    }

    .edit-input {
      width: 100%;
      min-width: 120px;
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: inherit;
      box-sizing: border-box;
      background-color: #f8fafc;
      transition: all 0.2s;
    }
    .edit-input:focus {
      background-color: #ffffff;
      border-color: var(--kai-orange, #F06400);
      outline: none;
      box-shadow: 0 0 0 3px rgba(240, 100, 0, 0.12);
    }

    .action-cell {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }

    .btn-action-row {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.2s;
    }
    .btn-action-row:hover { opacity: 0.85; }
    .btn-save-row { background-color: #10b981; color: white; }
    .btn-del-row { background-color: #ef4444; color: white; }

    /* SIDEBAR */
    .sidebar-item {
      display: flex; align-items: center; gap: 12px; padding: 11px 14px;
      color: #cbd5e1; text-decoration: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.86rem;
    }
    .sidebar-item:hover, .sidebar-item.active { color: #ffffff; background: rgba(240, 100, 0, 0.25); border: 1px solid rgba(240, 100, 0, 0.45); }
  </style>
</head>
<body>

  <header class="top-header" role="banner">
    <div class="top-header-inner" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div class="header-left-group" style="display: flex; align-items: center; gap: 14px;">
        <button onclick="toggleSidebar()" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 10px; border-radius: 4px; cursor: pointer;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <span class="brand-text">DIVRE I SUMATERA UTARA &bull; UPT CREW KA KISARAN</span>
      </div>

      <div class="topbar-right" style="display: flex; align-items: center; gap: 16px;">
        <div class="topbar-profile-container">
          <div class="topbar-profile-info">
            <span id="penyeliaNama" class="topbar-penyelia-nama">--</span>
            <span id="penyeliaNipp" class="topbar-penyelia-meta">NIPP. --</span>
            <span id="penyeliaJabatan" class="topbar-penyelia-jabatan">--</span>
          </div>
          <img id="penyeliaFoto" src="https://via.placeholder.com/150" alt="Foto" class="topbar-penyelia-avatar">
          <button type="button" class="btn-topbar-logout" onclick="handleLogout()">Keluar</button>
        </div>
      </div>
    </div>
  </header>

  <div class="app-layout-wrapper">
    <!-- SIDEBAR -->
    <aside class="app-sidebar collapsed no-print" id="app-sidebar" aria-label="Sidebar Navigasi">
      <div>
        <div class="sidebar-section-title" style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--kai-orange); letter-spacing: 1px; margin-bottom: 14px; padding-left: 4px;">MENU UTAMA</div>
        
        <nav style="display: flex; flex-direction: column; gap: 16px;">
          <a href="../index.html" class="sidebar-item" title="Homepage">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span class="sidebar-text">Homepage</span>
          </a>

          <a href="./assesment.html" class="sidebar-item" title="Laporan Dinas">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1" fill="#1C2A5F" stroke="#1C2A5F"></rect>
              <path d="M9 14l2 2 4-4" stroke="#F06400" stroke-width="2.5"></path>
            </svg>
            <span class="sidebar-text">Laporan Dinas</span>
          </a>


          <a href="./cetak.html" class="sidebar-item" title="Cetak Laporan">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            <span class="sidebar-text">Cetak Laporan</span>
          </a>
        </nav>
      </div>
    </aside>

    <main class="app-main-content">
      <div class="dashboard-content form-page-container">

        <h1 class="page-title-outer">Edit & Kelola Laporan Dinas</h1>

        <!-- TAB SWITCHER -->
        <div class="form-tab-container">
          <button type="button" class="form-tab-btn active" id="btnTabAwal" onclick="switchEditTab('awal')">Form Awal Dinas</button>
          <button type="button" class="form-tab-btn" id="btnTabAkhir" onclick="switchEditTab('akhir')">Form Akhir Dinas</button>
        </div>

        <!-- FILTER TANGGAL -->
        <div class="filter-card">
          <div class="filter-group">
            <label class="filter-label">Pilih Tanggal Dinas:</label>
            <input type="date" id="inputTanggalEdit" class="filter-input">
          </div>
          <button type="button" class="btn-load" onclick="loadEditData()">Tampilkan Data</button>
        </div>

        <!-- TABEL DATA INTERAKTIF -->
        <div class="table-card">
          <div class="table-responsive">
            <table class="edit-table" id="editTable">
              <thead>
                <tr id="tableHeaderRow">
                  <th>Memuat Data...</th>
                </tr>
              </thead>
              <tbody id="tableBodyRow">
                <tr>
                  <td colspan="10" style="padding: 30px; color: #64748b; font-weight: 500;">Silakan pilih tanggal dan klik "Tampilkan Data".</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    const loggedInNama = localStorage.getItem("loggedInUserNama");
    const loggedInNipp = localStorage.getItem("loggedInUserNipp");
    const loggedInJabatan = localStorage.getItem("loggedInUserJabatan");

    if (!loggedInNama || !loggedInNipp) {
      Swal.fire({ title: 'Akses Ditolak!', text: 'Login terlebih dahulu.', icon: 'warning', confirmButtonColor: '#1C2A5F' }).then(() => {
        window.location.href = "login.html";
      });
    }

    function handleLogout() {
      Swal.fire({
        title: 'Konfirmasi Logout', text: 'Yakin ingin keluar dari sistem?', icon: 'question',
        showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#64748b',
        confirmButtonText: 'Ya, Logout', cancelButtonText: 'Batal'
      }).then((result) => {
        if (result.isConfirmed) { localStorage.clear(); window.location.href = "login.html"; }
      });
    }

    let activeEditType = 'awal';
    const API_URL = "https://script.google.com/macros/s/AKfycbycTmSZR5MyhRkhrP-T_JqRlOuL56DkquxPJPmMLTXCuZjbwcgLdRJpsFJTX6ZeKEEr1A/exec";

    function switchEditTab(type) {
      activeEditType = type;
      document.getElementById("btnTabAwal").classList.toggle("active", type === 'awal');
      document.getElementById("btnTabAkhir").classList.toggle("active", type === 'akhir');
      loadEditData();
    }

    async function loadEditData() {
      const tanggal = document.getElementById("inputTanggalEdit").value;
      if (!tanggal) {
        Swal.fire("Peringatan", "Pilih tanggal dinas terlebih dahulu!", "warning");
        return;
      }

      const headerRow = document.getElementById("tableHeaderRow");
      const tbody = document.getElementById("tableBodyRow");
      tbody.innerHTML = `<tr><td colspan="10" style="padding: 30px; color: #64748b;">Memuat data tanggal ${tanggal}...</td></tr>`;

      try {
        const res = await fetch(`${API_URL}?action=getEditData&tanggal=${encodeURIComponent(tanggal)}&tipe=${activeEditType}`);
        const result = await res.json();

        if (result.status === "success") {
          const rows = result.data || [];
          if (rows.length === 0) {
            headerRow.innerHTML = `<th>Informasi</th>`;
            tbody.innerHTML = `<tr><td colspan="6" style="padding: 30px; color: #64748b; font-weight: 500;">Tidak ada data laporan ditemukan pada tanggal tersebut.</td></tr>`;
            return;
          }

          const keys = Object.keys(rows[0]).filter(k => k !== '_rowIndex');
          let thHtml = "";
          keys.forEach(k => { thHtml += `<th>${k}</th>`; });
          thHtml += `<th style="width: 140px;">Aksi</th>`;
          headerRow.innerHTML = thHtml;

          let trHtml = "";
          rows.forEach((row) => {
            trHtml += `<tr data-rowindex="${row._rowIndex}">`;
            keys.forEach(k => {
              const val = row[k] !== undefined ? row[k] : '';
              const isReadOnly = (k.toLowerCase() === 'no' || k.toLowerCase() === 'tanggal') ? 'readonly style="background:#e2e8f0; color:#475569; font-weight:bold; cursor:not-allowed;"' : '';
              trHtml += `<td><input type="text" class="edit-input" data-key="${k}" value="${val}" ${isReadOnly}></td>`;
            });
            trHtml += `
              <td>
                <div class="action-cell">
                  <button type="button" class="btn-action-row btn-save-row" onclick="saveRow(this)">Simpan</button>
                  <button type="button" class="btn-action-row btn-del-row" onclick="deleteRow(this)">Hapus</button>
                </div>
              </td>
            `;
            trHtml += `</tr>`;
          });
          tbody.innerHTML = trHtml;
        }
      } catch (err) {
        console.error(err);
        Swal.fire("Error", "Gagal memuat data dari server.", "error");
      }
    }

    async function saveRow(btn) {
      const tr = btn.closest("tr");
      const rowIndex = tr.getAttribute("data-rowindex");
      const inputs = tr.querySelectorAll(".edit-input");
      
      let rowData = {};
      inputs.forEach(input => {
        rowData[input.getAttribute("data-key")] = input.value;
      });

      btn.disabled = true; btn.textContent = "Proses...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "updateFormDinas",
            tipe: activeEditType,
            rowIndex: rowIndex,
            data: rowData
          })
        });
        const result = await res.json();
        if (result.status === "success") {
          Swal.fire({ title: 'Berhasil', text: 'Perubahan data berhasil disimpan.', icon: 'success', timer: 1200, showConfirmButton: false });
        } else {
          Swal.fire('Gagal', result.message, 'error');
        }
      } catch (err) {
        Swal.fire('Error', 'Gagal terhubung ke server.', 'error');
      } finally {
        btn.disabled = false; btn.textContent = "Simpan";
      }
    }

    async function deleteRow(btn) {
      const tr = btn.closest("tr");
      const rowIndex = tr.getAttribute("data-rowindex");

      const confirm = await Swal.fire({
        title: 'Hapus Baris Data?',
        text: 'Data laporan yang dihapus tidak dapat dipulihkan!',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Ya, Hapus',
        cancelButtonText: 'Batal'
      });

      if (confirm.isConfirmed) {
        try {
          const res = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "deleteFormDinas",
              tipe: activeEditType,
              rowIndex: rowIndex
            })
          });
          const result = await res.json();
          if (result.status === "success") {
            Swal.fire('Terhapus!', 'Baris data berhasil dihapus.', 'success');
            tr.remove();
          } else {
            Swal.fire('Gagal', result.message, 'error');
          }
        } catch (err) {
          Swal.fire('Error', 'Gagal terhubung ke server.', 'error');
        }
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("penyeliaNama").textContent = loggedInNama || "--";
      document.getElementById("penyeliaNipp").textContent = "NIPP. " + (loggedInNipp || "--");
      document.getElementById("penyeliaJabatan").textContent = loggedInJabatan || "PENYELIA";

      const today = new Date().toISOString().split("T")[0];
      document.getElementById("inputTanggalEdit").value = today;

      const imgEl = document.getElementById("penyeliaFoto");
      if (imgEl && loggedInNipp) {
        const cleanNipp = String(loggedInNipp).trim();
        imgEl.src = `../assets/struktur-organisasi/${cleanNipp}.jpg`;
        imgEl.onerror = function() {
          if (this.src.endsWith(".jpg")) {
            this.src = `../assets/struktur-organisasi/${cleanNipp}.png`;
          } else {
            this.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(loggedInNama)}&background=1C2A5F&color=fff`;
          }
        };
      }
    });

    function toggleSidebar() { document.getElementById('app-sidebar').classList.toggle('collapsed'); }
  </script>
</body>
</html>
